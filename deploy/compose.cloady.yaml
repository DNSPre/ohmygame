services:
  studio:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.cloady-studio
    environment:
      OHMYGAME_DAEMON_TOKEN: ${STUDIO_DAEMON_TOKEN:?Set STUDIO_DAEMON_TOKEN}
    expose:
      - "43210"
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 896M
    volumes:
      - studio-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:43210/health',{headers:{Authorization:'Bearer '+process.env.OHMYGAME_DAEMON_TOKEN}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: gateway
    depends_on:
      studio:
        condition: service_healthy
    environment:
      STUDIO_SITE: http://:80
      STUDIO_ORIGIN: ${CLOADY_PRIMARY_URL:-https://studio.example.invalid}
      STUDIO_CUSTOM_ORIGIN: https://game.design.cab
      STUDIO_DAEMON_TOKEN: ${STUDIO_DAEMON_TOKEN:?Set STUDIO_DAEMON_TOKEN}
      STUDIO_USER: ${STUDIO_USER:-studio}
      STUDIO_PASSWORD_HASH: ${STUDIO_PASSWORD_HASH:?Set STUDIO_PASSWORD_HASH}
    ports:
      - "80:80"
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 128M

volumes:
  studio-data:
