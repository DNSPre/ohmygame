services:
  studio:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: studio
    restart: unless-stopped
    environment:
      OHMYGAME_DAEMON_TOKEN: ${STUDIO_DAEMON_TOKEN:?Set STUDIO_DAEMON_TOKEN}
    volumes:
      - studio-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:43210/health',{headers:{Authorization:'Bearer '+process.env.OHMYGAME_DAEMON_TOKEN}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: gateway
    restart: unless-stopped
    depends_on:
      studio:
        condition: service_healthy
    environment:
      STUDIO_SITE: ${STUDIO_SITE:-game.design.cab}
      STUDIO_ORIGIN: ${STUDIO_ORIGIN:-https://game.design.cab}
      STUDIO_DAEMON_TOKEN: ${STUDIO_DAEMON_TOKEN:?Set STUDIO_DAEMON_TOKEN}
      STUDIO_USER: ${STUDIO_USER:-studio}
      STUDIO_PASSWORD_HASH: ${STUDIO_PASSWORD_HASH:?Set STUDIO_PASSWORD_HASH}
    ports:
      - "${STUDIO_HTTP_BIND:-80}:80"
      - "${STUDIO_HTTPS_BIND:-443}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  studio-data:
  caddy-data:
  caddy-config:
